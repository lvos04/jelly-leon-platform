# Release: tag v<VERSION> → image testen, naar GHCR pushen, SBOM maken, digest vastleggen.
# Image: ghcr.io/lvos04/jelly-leon-platform:<VERSION> (standaard TrueNAS Custom App, alles-in-één).
# release/digests.json met de echte digest komt als release-asset en workflow-artefact mee; het manifest
# (deploy/manifest/*.yaml) krijgt de digest pas na deze stap (nooit vooraf invullen).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Versie controleren
        id: v
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "ongeldige versie in VERSION: $v"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "tag ${GITHUB_REF_NAME} past niet bij VERSION $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Bouwen (lokaal, nog niet gepusht)
        run: |
          docker buildx build --load -f deploy/allinone/Dockerfile \
            --build-arg VERSION=${{ steps.v.outputs.version }} --build-arg REVISION="$GITHUB_SHA" \
            -t jelly-leon-platform:release .
      - name: Image-E2E vóór publicatie
        env:
          LIFECYCLE_IMAGE: jelly-leon-platform:release
        run: |
          pip install -e 'apps/api[test]'
          sudo --preserve-env=LIFECYCLE_IMAGE,PATH "$(which python)" -m pytest -q tests/e2e
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pushen en digest vastleggen
        id: push
        run: |
          v=${{ steps.v.outputs.version }}
          ref=ghcr.io/lvos04/jelly-leon-platform:$v
          docker tag jelly-leon-platform:release "$ref"
          docker push "$ref"
          digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | python -c 'import json,sys;print(json.load(sys.stdin)["digest"])')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          python - "$v" "$digest" "$GITHUB_SHA" <<'PY'
          import json, sys, datetime
          v, digest, sha = sys.argv[1:4]
          doc = {"schema_version": "1", "app_id": "jelly-leon-platform", "version": v,
                 "images": {"ghcr.io/lvos04/jelly-leon-platform": {"tag": v, "digest": digest}},
                 "source_commit": sha, "built_at": datetime.datetime.now(datetime.UTC).isoformat()}
          open("release/digests.json", "w").write(json.dumps(doc, indent=2) + "\n")
          PY
          cat release/digests.json
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: ghcr.io/lvos04/jelly-leon-platform:${{ steps.v.outputs.version }}
          format: spdx-json
          output-file: release/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.v.outputs.version }}
          path: |
            release/digests.json
            release/sbom.spdx.json
      - name: GitHub-release met digest en SBOM
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/digests.json release/sbom.spdx.json \
            --title "jelly-leon-platform ${{ steps.v.outputs.version }}" \
            --notes "Image: ghcr.io/lvos04/jelly-leon-platform:${{ steps.v.outputs.version }}@${{ steps.push.outputs.digest }} — installeren als standaard TrueNAS Custom App (deploy/truenas/CUSTOM_APP.md). Op echte TrueNAS NIET GEVALIDEERD." \
            || gh release upload "${GITHUB_REF_NAME}" release/digests.json release/sbom.spdx.json --clobber
