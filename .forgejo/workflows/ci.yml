name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASF_COMMIT: a994c2a51f45b81b2c48c6533b0ccf51ba857f5a

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Contract-, Peil- en validatorbronnen ophalen
        env:
          BRON_TOKEN: ${{ secrets.BRON_LEESTOKEN }}
        run: bash .forgejo/ci/bronnen.sh test
      - name: Python 3.12 voorbereiden
        run: bash .forgejo/ci/python.sh
      - name: Installeren
        run: |
          python -m pip install --upgrade pip==26.3
          pip install -e 'apps/api[test]' -e 'e2e/simulators/truenas[test]' -e 'e2e/simulators[test]'
      - name: Ruff
        run: ruff check .
      - name: Workflows controleren (actionlint + shellcheck)
        run: |
          pip install actionlint-py==1.7.12.25 shellcheck-py==0.11.0.1
          bash .forgejo/ci/workflowlint.sh
      - name: Mypy (strict)
        run: |
          (cd apps/api && mypy)
          mypy --strict --python-version 3.12 e2e/simulators/truenas/src/truenas_sim tools/peil_kopie.py tools/contract_kopie.py \
            tools/manifesten.py tools/manifest_kopie.py tools/checklists.py tools/rooktest.py tools/upstream_rooktest.py \
            tools/validator_kopie.py tools/nodered_flows.py
          (cd e2e/simulators && mypy --strict --python-version 3.12 simkit beszel gotify authentik uptime_kuma arr sabnzbd qbittorrent gree homewizard zigbee onedrive upstream-git/upstream_git_sim.py \
            --exclude '/tests/')
          MYPYPATH=e2e/simulators/hub mypy --strict --python-version 3.12 tests/ui/live/hub_review.py e2e/simulators/hub/executor_sim.py
          MYPYPATH=e2e/simulators/hub:tools mypy --strict --python-version 3.12 tools/nodered_rooktest.py
      - name: Eigen PostgreSQL 16 starten en verbinding controleren
        run: bash .forgejo/ci/postgres.sh start
      - name: Tests lifecycle-dienst (unit + integratie, incl. migraties up/down/up en drift)
        working-directory: apps/api
        run: python -m pytest -q
      - name: Tests TrueNAS-simulator
        working-directory: e2e/simulators/truenas
        run: python -m pytest -q
      - name: Tests derden-simulators en downloadketen (protocol en foutinjectie)
        env:
          MSO_BRON: ${{ runner.temp }}/mso-bron
          MY_HOUSE_BRON: ${{ runner.temp }}/my-house-bron
        working-directory: e2e/simulators
        run: python -m pytest -q
      - name: Conformiteit met contract 1.3 (Hub-simulator; dezelfde tests draaien lokaal tegen de echte Hub)
        run: python -m pytest -q tests/conformance
      - name: Validator uit de gepinde bron installeren
        run: bash .forgejo/ci/validator.sh "$RUNNER_TEMP/appstore" "$RUNNER_TEMP/validator"
      - name: Installeerbare manifesten met de strikte validator controleren
        env:
          JL_MANIFEST: ${{ runner.temp }}/validator/bin/jl-manifest
        run: python tools/manifesten.py
      - name: Node-RED-flows (make nodered; FLOWS gelijk aan de overrides, bundels door de eigen controle, lock actueel)
        run: make nodered PY=python
      - name: Repositorycontroles met verplichte bron- en manifestvalidatie
        env:
          PEIL_BRON: ${{ runner.temp }}/peil-bron
          PEIL_BRON_VERPLICHT: "1"
          JL_MANIFEST: ${{ runner.temp }}/validator/bin/jl-manifest
          MANIFEST_VALIDATOR_VERPLICHT: "1"
          APPSTORE_BRON: ${{ runner.temp }}/appstore
          VALIDATOR_BRON_VERPLICHT: "1"
          MGU_BRON: ${{ runner.temp }}/mgu-bron
          MSO_BRON: ${{ runner.temp }}/mso-bron
          MY_HOUSE_BRON: ${{ runner.temp }}/my-house-bron
        run: python -m pytest -q -rs tests/repo
      - name: OpenAPI-drift
        run: |
          python -m lifecycle export-openapi "$RUNNER_TEMP/openapi.json"
          diff -u docs/openapi/jelly-leon-platform.openapi.json "$RUNNER_TEMP/openapi.json"
      - name: pip-audit (runtime-lock)
        run: pip-audit --cache-dir "$(mktemp -d "$RUNNER_TEMP/pip-audit.XXXXXXXX")" --strict --require-hashes --disable-pip -r apps/api/requirements.lock
      - name: Eigen testdatabase opruimen
        if: always()
        run: bash .forgejo/ci/postgres.sh stop

  statuspagina:
    # Peil-statuspagina 1.1.1 (JP11): HTML per toestand uit de echte dienst (PostgreSQL + Hub-simulator), daarna in
    # Chromium: axe-core (WCAG 2.2 AA-tags) = 0, geen overloop en geen inhoud buiten zijn element op 320–1440 px, ook
    # met DejaVu Sans, doelen ≥ 44 px, tekst ≥ 14 px, focusring, CSP zonder overtredingen; live met de negatieve
    # herkomstgevallen van contract 1.3 §3.7; schermafdrukken als artefact (geen pixel-baselines, ONTWERPTAAL §12).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Python 3.12 voorbereiden
        run: bash .forgejo/ci/python.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Installeren (dienst, Playwright 1.65.0 + axe-core 4.14.0 uit package-lock.json, Chromium)
        run: |
          python -m pip install --upgrade pip==26.3
          pip install -e 'apps/api[test]'
          npm ci --prefix tests/ui --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/jlp-chromium"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          node tests/ui/node_modules/playwright/cli.js install --with-deps chromium
      - name: Eigen PostgreSQL 16 starten en verbinding controleren
        run: bash .forgejo/ci/postgres.sh start
      - name: Statuspagina per toestand renderen (momentopnamen)
        working-directory: apps/api
        env:
          STATUSPAGINA_SNAPSHOTS: ${{ runner.temp }}/statuspagina
        run: python -m pytest -q tests/integration/test_statuspage_peil.py
      - name: Browsercontrole (axe, contrast, statusregels, 320–1440 px) en schermafdrukken
        run: |
          node tests/ui/controle.mjs --map "$RUNNER_TEMP/statuspagina" --shots "$RUNNER_TEMP/schermafdrukken" \
            --rapport "$RUNNER_TEMP/schermafdrukken/rapport.json"
      - name: Browsercontrole met DejaVu Sans (reflow met het lettertype van de runner, Peil 1.1.1 E12)
        run: |
          node tests/ui/controle.mjs --map "$RUNNER_TEMP/statuspagina" --letter "DejaVu Sans" \
            --rapport "$RUNNER_TEMP/schermafdrukken/rapport-dejavu.json"
      - name: Live ontwerpreview (dienst als echte processen; negatieve herkomstgevallen in Chromium, §3.7)
        run: |
          node tests/ui/live/live.mjs --map "$RUNNER_TEMP/live" --python "$(command -v python)" --pg "${LIFECYCLE_TEST_PG%/postgres}"
          node tests/ui/controle.mjs --map "$RUNNER_TEMP/live" --shots "$RUNNER_TEMP/schermafdrukken/live" \
            --shot-toestanden alle --shot-breedtes 320,1440 --rapport "$RUNNER_TEMP/schermafdrukken/rapport-live.json"
      - name: Schermafdrukken en rapport bewaren
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: statuspagina-peil
          path: ${{ runner.temp }}/schermafdrukken
          if-no-files-found: warn
          retention-days: 14
      - name: Eigen testdatabase opruimen
        if: always()
        run: bash .forgejo/ci/postgres.sh stop

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    env:
      LIFECYCLE_IMAGE: jelly-leon-platform:ci-${{ github.run_id }}
      SIM_IMAGE: jlp-truenas-sim:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Alles-in-één image en TrueNAS-simulator bouwen
        run: |
          docker buildx build --load -f deploy/allinone/Dockerfile \
            --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" --build-arg REVISION="$GITHUB_SHA" -t "$LIFECYCLE_IMAGE" .
          docker buildx build --load -t "$SIM_IMAGE" e2e/simulators/truenas
      - name: Start, healthchecks, image-E2E en upgrade met herstel
        run: bash .forgejo/ci/dockerproef.sh image
      - name: Eigen harnas en proefcontainers opruimen
        if: always()
        run: bash .forgejo/ci/dockerproef.sh ruim
      - name: Eigen imagetags opruimen
        if: always()
        run: docker image rm "$LIFECYCLE_IMAGE" "$SIM_IMAGE" || true

  rooktest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: test
    env:
      ASM_COMMIT: f9f0a448666cd209f535bb20b0a82a8ae6185af0
      HUB_IMAGE: jlp-rooktest/ai-server-manager:ci-${{ github.run_id }}
      EXECUTOR_IMAGE: jlp-rooktest/ai-server-manager-executor:ci-${{ github.run_id }}
      LIFECYCLE_IMAGE: jlp-rooktest/jelly-leon-platform:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Gepinde Hub, executor en validator ophalen
        env:
          BRON_TOKEN: ${{ secrets.BRON_LEESTOKEN }}
        run: bash .forgejo/ci/bronnen.sh rooktest
      - name: Images bouwen uit de gepinde bronnen
        run: |
          docker buildx build --load -f "$RUNNER_TEMP/asm/deploy/allinone/Dockerfile" --build-arg REVISION="$ASM_COMMIT" \
            -t "$HUB_IMAGE" "$RUNNER_TEMP/asm"
          docker buildx build --load -f "$RUNNER_TEMP/asm/deploy/executor/Dockerfile" --build-arg REVISION="$ASM_COMMIT" \
            -t "$EXECUTOR_IMAGE" "$RUNNER_TEMP/asm"
          docker buildx build --load -f deploy/allinone/Dockerfile --build-arg VERSION="$(tr -d '[:space:]' < VERSION)" \
            --build-arg REVISION="$GITHUB_SHA" -t "$LIFECYCLE_IMAGE" .
      - name: Installatie, upstream-images als 568 en Node-RED tegen simulators beproeven
        run: bash .forgejo/ci/dockerproef.sh rooktest
      - name: Eigen harnas en proefcontainers opruimen
        if: always()
        run: bash .forgejo/ci/dockerproef.sh ruim
      - name: Rookrapporten bewaren
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: rooktest-p1
          path: ${{ runner.temp }}/rookrapporten/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Eigen imagetags opruimen
        if: always()
        run: docker image rm "$HUB_IMAGE" "$EXECUTOR_IMAGE" "$LIFECYCLE_IMAGE" || true
