# Waarschuwingen van de manifestvalidator (appstore-en-fork, `jl-manifest validate --strict`) die voor deze
# manifesten bewust en eerlijk blijven staan (ADR-0014 §4). Alles wat hier NIET staat, laat de CI falen: elk ander
# manifest moet `--strict` zonder één melding halen, en bij deze manifesten moet de set waarschuwingen EXACT gelijk
# zijn aan deze lijst (geen fouten, geen andere of extra waarschuwingen). Een uitzondering verdwijnt zodra de oorzaak
# weg is (de test faalt dan ook, zodat deze lijst niet stilletjes verouderd raakt).
# Gemeld als contract_issue: de manifeststandaard kent geen geaccepteerde waarschuwing per manifest.
uitzonderingen:
  gotify:
    - code: backup_db_export_none
      pad: backup.db_export
      reden_nl: >-
        Gotify heeft geen database-export en het platform heeft geen shell in de container. De enige consistente
        back-up is een ZFS-snapshot met de app gestopt; terugzetten na een migratie = snapshot-restore. Dat is precies
        wat de waarschuwing zegt; een andere db_export-waarde zou onwaar zijn.
  uptime-kuma:
    - code: backup_db_export_none
      pad: backup.db_export
      reden_nl: >-
        Uptime Kuma 2.x heeft de ingebouwde export laten vallen; zelfde situatie als Gotify (snapshot met de app gestopt).
  authentik:
    - code: secret_in_form
      pad: values.authentik.db_password
      reden_nl: >-
        De TrueNAS-catalogusapp vereist het databasewachtwoord als (privé-)waarde in app.create. De Hub maakt het zelf
        (vault, source generated) en geeft het alleen in de R2-actie mee; nooit in Git, logs of evidence.
    - code: secret_in_form
      pad: values.authentik.secret_key
      reden_nl: >-
        Idem voor AUTHENTIK_SECRET_KEY (verplichte privé-waarde van de catalogusapp).
  ai-server-manager:
    - code: digest_pending_release
      pad: image.digest
      reden_nl: >-
        Eigen image van ai-server-manager zonder release: de digest vult de release-CI van die repo in. Tot dan is
        installeren Geblokkeerd (INSTALLATIE.md stap 1). Kopie van het manifest van de eigenaar (I23).
  ai-server-manager-executor:
    - code: digest_pending_release
      pad: image.digest
      reden_nl: Idem voor de executor-image (I23).
