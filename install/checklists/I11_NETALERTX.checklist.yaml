checklist_version: "1"
kind: checklist
install: {method: none}
id: I11
titel_nl: NetAlertX voorbereiden en controleren
document: 03_INSTALLATIE/I11_NETALERTX.md
eigenaar_repo: lvos04/jelly-leon-platform
aanpak: inrichten_en_testen
installatie: geen
mutaties_door_platform: false
besluiten: [D01, D02, D03, D04, D05, D11, D16]
toelichting_nl: >-
  De installatie is geblokkeerd. De Python-interpreter van de upstream-image vraagt netwerkrechten
  die het installatiebeleid van de Hub weigert. Stap 2 wacht op een werkend, toegelaten manifest.
  Leg de uitkomsten van N-P6-07 privé vast. Maskeer apparaatnamen en adressen in bewijs voor anderen.
  Stop na een rode controle of een ontbrekend herstelpunt.
stappen:
  - id: I11-11-01
    titel_nl: Passieve basis en scope
    uitvoeren_nl: >-
      Leg privé vast welke subnetten en bronnen zijn toegestaan, welke apparaten je verwacht, wie de
      gegevens mag zien en hoe lang je MAC- en IP-historie bewaart. D03 (adres en domeinen) en D11
      (router en DNS-terugval) blijven open invulvelden. Begin met passieve waarneming binnen de gekozen
      scope. Actief scannen staat standaard uit en vraagt een afzonderlijke keuze van de gebruiker.
    acceptatie_nl: Nog geen ongeautoriseerde scan buiten LAN.
    risico: Hoog
    wijze: [handmatig_bewijs]
    besluiten: [D03, D11]
    bewijs: [datum, gemaskeerde_output, status, bewijsrecord_besluit]
    bij_fout_nl: >-
      Houd de waarneming uitgeschakeld en herstel de vorige scope en bewaartermijn voordat je verdergaat.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS)]

  - id: I11-11-02
    titel_nl: Install en netwerk
    uitvoeren_nl: >-
      Stop hier zolang een toegelaten manifest ontbreekt. Controleer daarna in de preview van de standaard
      Custom App de tag en digest, de vrije poort en de eigen dataset voor configuratie en database.
      Toets na de installatie de inhoudelijke dienstrespons, de beheerderstoegang en de herkomst van
      één bekend apparaat in de afgesproken passieve bron. Leg de teruggelezen digest en de uitkomst vast.
    acceptatie_nl: App leest echte LAN devices.
    risico: Hoog
    wijze: [handmatig_in_truenas_ui, handmatig_bewijs]
    handmatig_ui_pad_nl: Apps → Installed Applications → NetAlertX
    besluiten: [D01, D02, D03]
    bewijs: [nas_versie, image_digest, datum, gemaskeerde_output, status]
    bij_fout_nl: >-
      Breek de preview af. Is NetAlertX al gestart, stop dan alleen de nieuwe app, bewaar de dataset en
      herstel bij een update de vorige gepinde image met het bijpassende herstelpunt.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS)]

  - id: I11-11-03
    titel_nl: Known devices baseline
    uitvoeren_nl: >-
      Label de bekende router, NAS, IoT-apparaten en telefoons in NetAlertX. Volg één toegestaan
      proefapparaat bij een DHCP-adreswissel. Vergelijk de identiteit en de adreshistorie vóór en na de wissel.
    acceptatie_nl: DHCP adreswissel leidt niet tot dubbele apparaten.
    risico: Middel
    wijze: [handmatig_bewijs]
    besluiten: [D03]
    bewijs: [datum, gemaskeerde_output, status]
    bij_fout_nl: >-
      Pauzeer de invoer, bewaar beide waarnemingen en herstel de vorige labels. Hervat na controle
      dat dezelfde identiteit haar historie houdt.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS)]

  - id: I11-11-04
    titel_nl: Alert test
    uitvoeren_nl: >-
      Bied één nieuw testapparaat binnen de afgesproken scope aan of simuleer de waarneming.
      Controleer dat de melding het apparaat als nieuw beschrijft en vermeldt hoe zeker de herkenning is.
    acceptatie_nl: Geen false malware claim.
    risico: Middel
    wijze: [handmatig_bewijs]
    besluiten: [D03]
    bewijs: [datum, gemaskeerde_output, status]
    bij_fout_nl: >-
      Pauzeer de nieuwe meldregel, bewaar het gemaskeerde voorbeeld en herstel de eerdere meldinstelling.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS)]

  - id: I11-11-05
    titel_nl: Hub connector
    uitvoeren_nl: >-
      Controleer dat de Hub via een alleen-lezen-koppeling de apparaatstatus en wijzigingsgebeurtenissen
      mag ophalen. Vergelijk één bekende identiteit en de adreswissel uit stap 3 in beide weergaven.
      Laat de koppeling uit zolang de toegang tot die leesfuncties niet afdoende is begrensd.
    acceptatie_nl: Hub herkent identieke host.
    risico: Middel
    wijze: [handmatig_bewijs]
    besluiten: [D03]
    bewijs: [datum, gemaskeerde_output, status]
    bij_fout_nl: >-
      Pauzeer alleen de nieuwe Hub-invoer. Trek de bijbehorende toegang in en bewaar de laatste
      waarnemingen en hun oorspronkelijke meettijd.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS), NIET GEVALIDEERD (account)]

  - id: I11-11-06
    titel_nl: Privacy en backup
    uitvoeren_nl: >-
      Neem de eigen NetAlertX-dataset met configuratie en database op in de versleutelde back-up.
      Stop NetAlertX voor een consistente snapshot. Herstel een kopie met de bijbehorende image in een
      geïsoleerde proefomgeving. Controleer labels en historie. Toets op de kopie met gedateerde proefrecords
      dat verlopen historie verdwijnt en recente historie behouden blijft. Vergelijk verlies en hersteltijd met D16.
    acceptatie_nl: Herstel en purging werken.
    risico: Hoog
    wijze: [handmatig_bewijs, verwijzing]
    verwijzing: [install/checklists/I02_BACKUP_EN_RESTORE.checklist.yaml]
    besluiten: [D02, D04, D05, D16]
    bewijs: [image_digest, datum, gemaskeerde_output, status, bewijsrecord_besluit]
    bij_fout_nl: >-
      Pauzeer de invoer en de opschoning. Bewaar auditgegevens en de versleutelde back-up. Herstel de
      vorige gepinde image met haar bijpassende snapshot op de proefkopie. Controleer toegang, inhoud en
      afnemers en leg vast wat is hersteld. Verwijder de oorspronkelijke data alleen na afzonderlijke bevestiging.
    blokkeert_volgende: true
    validatie_nu: [NIET GEVALIDEERD (echte NAS)]
