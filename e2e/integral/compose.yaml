# Uitsluitend lokale integratieproeven. Alle volumes en het interne netwerk zijn projectgebonden.
x-bouw: &bouw
  labels: &herkomst
    nl.jelly-leon.bronstatus: ${INTEGRAAL_BRONSTATUS:-onbekend}
    nl.jelly-leon.broncommit: ${INTEGRAAL_BRONCOMMIT:-onbekend}
  args:
    REVISION: ${INTEGRAAL_BRONCOMMIT:-onbekend}
x-derden: &derden
  profiles: [derden]
  image: jlp-integraal/simulators:${INTEGRAAL_TAG:-lokaal}
  build:
    <<: *bouw
    context: ../..
    dockerfile: e2e/integral/Dockerfile.simulators
x-mso-sim: &mso-sim
  profiles: [mso]
  image: jlp-integraal/mso-simulators:${INTEGRAAL_TAG:-lokaal}
  build:
    <<: *bouw
    context: ${INTEGRAAL_MSO_MOCKS_BRON:-${INTEGRAAL_BRONMAP:-../../..}/media-source-optimizer/apps/mocks}
  environment:
    PYTHONPATH: /sim:/opt/mocks
  volumes: [../simulators:/sim:ro]
  entrypoint: [python, -m]
# De inhoudsproeven gebruiken de productiekern en de herstelwerker met dezelfde testbibliotheek.
x-mg-inhoud: &mg-inhoud
  profiles: [media-inhoud]
  image: jlp-integraal/mg-inhoud:${INTEGRAAL_TAG:-lokaal}
  build:
    <<: *bouw
    context: ${INTEGRAAL_BRONMAP:-../../..}/media-guard-ultimate/apps/core
  volumes: [inhoud-config:/config, inhoud-werk:/work, inhoud-media:/media]
x-truenas: &truenas
  image: jlp-integraal/truenas:${INTEGRAAL_TAG:-lokaal}
  build:
    <<: *bouw
    context: ../simulators/truenas
  tmpfs:
    - /certificaat:uid=568,mode=0700
  command:
    - sh
    - -ec
    - |
      umask 077
      openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
        -subj "/CN=$$HOSTNAME" -addext "subjectAltName=DNS:$$HOSTNAME" \
        -keyout /certificaat/sim.key -out /certificaat/sim.crt
      exec python -m truenas_sim --host "$$HOSTNAME" --port 8080 \
        --ssl-certfile /certificaat/sim.crt --ssl-keyfile /certificaat/sim.key
  healthcheck:
    test: ["CMD", "python", "-c", "import json,os,ssl,urllib.request as u; c=ssl.create_default_context(cafile='/certificaat/sim.crt'); assert json.load(u.urlopen('https://'+os.environ['HOSTNAME']+':8080/api/versions',context=c,timeout=3))"]
    interval: 5s
    timeout: 4s
    retries: 12

services:
  hub:
    profiles: [kern]
    image: jlp-integraal/hub:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/ai-server-manager
      dockerfile: deploy/allinone/Dockerfile
    environment:
      HUB_AI_ENABLED: "false"
    ports: ["127.0.0.1:${INTEGRAAL_HUB_POORT:-30400}:30400"]
    volumes: [hub:/appdata]
  executor:
    profiles: [kern]
    image: jlp-integraal/executor:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/ai-server-manager
      dockerfile: deploy/executor/Dockerfile
    environment:
      EXECUTOR_TRUENAS_HOST: truenas
      EXECUTOR_TRUENAS_PORT: "8080"
    ports: ["127.0.0.1:${INTEGRAAL_EXECUTOR_POORT:-30410}:30410"]
    volumes: [executor:/appdata]
  truenas:
    <<: *truenas
    profiles: [kern]
    hostname: truenas
  lifecycle:
    profiles: [kern]
    image: jlp-integraal/lifecycle:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ../..
      dockerfile: deploy/allinone/Dockerfile
    environment:
      HUB_URL: http://hub:30400
      HUB_ENROLLMENT_TOKEN: ${INTEGRAAL_ENROLLMENT:-}
      HUB_KEY_FINGERPRINT: ${INTEGRAAL_VINGERAFDRUK:-}
    ports: ["127.0.0.1:${INTEGRAAL_LIFECYCLE_POORT:-30440}:30440"]
    volumes: [lifecycle:/appdata]

  mediaguard:
    profiles: [media]
    image: jlp-integraal/mediaguard:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/media-guard-ultimate/deploy/aio
      labels:
        <<: *herkomst
        nl.jelly-leon.mg.encode: ${INTEGRAAL_MG_ENCODE_ID:-onbekend}
        nl.jelly-leon.mg.web: ${INTEGRAAL_MG_WEB_ID:-onbekend}
        nl.jelly-leon.mg.sonarr: ${INTEGRAAL_MG_SONARR_ID:-onbekend}
        nl.jelly-leon.mg.radarr: ${INTEGRAAL_MG_RADARR_ID:-onbekend}
      additional_contexts:
        core: ${INTEGRAAL_BRONMAP:-../../..}/media-guard-ultimate/apps/core
        release: ${INTEGRAAL_BRONMAP:-../../..}/media-guard-ultimate/deploy
      args:
        ENCODE_IMAGE: jlp-integraal/mg-encode:${INTEGRAAL_TAG:-lokaal}
        WEB_IMAGE: jlp-integraal/mg-web:${INTEGRAAL_TAG:-lokaal}
        SONARR_IMAGE: jlp-integraal/mg-sonarr:${INTEGRAAL_TAG:-lokaal}
        RADARR_IMAGE: jlp-integraal/mg-radarr:${INTEGRAAL_TAG:-lokaal}
    ports: ["127.0.0.1:${INTEGRAAL_MEDIAGUARD_POORT:-30080}:30080"]
    volumes: [mediaguard:/config]
  mg-inhoud:
    <<: *mg-inhoud
    environment:
      MG_LIBRARY_ROOTS: /media
      MG_START_BACKGROUND: "0"
  mg-inhoud-herstel:
    <<: *mg-inhoud
    environment:
      MG_LIBRARY_ROOTS: /media
      MG_ROLE: recovery
  arr-inhoud:
    <<: *derden
    profiles: [media-inhoud]
    command: [arr-sim, --host, intern, --stagingproef]
    volumes: [inhoud-media:/media]
  mg-kwaliteitsmeting:
    profiles: [media-kwaliteit]
    image: jlp-integraal/mg-kwaliteitsmeting:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/media-guard-ultimate/services/encoder
      target: runtime
    cpus: 2
    volumes: [inhoud-media:/media]
  mso:
    profiles: [mso, media]
    image: jlp-integraal/mso:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/media-source-optimizer
      dockerfile: deploy/allinone/Dockerfile
    ports: ["127.0.0.1:${INTEGRAAL_MSO_POORT:-38081}:38081"]
    volumes: [mso:/appdata]
  sabnzbd-sim:
    <<: *mso-sim
    command: [sabnzbd, --host, intern]
  qbittorrent-sim:
    <<: *mso-sim
    command: [qbittorrent, --host, intern]
  qbittorrent-publiek:
    <<: *mso-sim
    command: [qbittorrent, --host, intern, --leeg]
  prowlarr-sim:
    <<: *mso-sim
    command: [arr, --prowlarr, --host, intern]
  mg-categorie-sim:
    <<: *mso-sim
    command: [simkit.mg_categorie, --host, intern]
  my-house:
    profiles: [huis]
    image: jlp-integraal/my-house:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/my_house
      dockerfile: deploy/allinone/Dockerfile
    ports: ["127.0.0.1:${INTEGRAAL_MY_HOUSE_POORT:-8088}:8080"]
    environment:
      TZ: UTC
      SHC_NTP_SERVER: ""
      SHC_PAIRING_ALLOWED_HOSTS: my-house,my-house:30221
      SHC_CLIMATE_INTERVAL_S: "2"
    volumes:
      - huis:/appdata
      - ../simulators/simkit:/huis-sim/simkit:ro
      - ../simulators/gree:/huis-sim/gree:ro
      - ../simulators/homewizard:/huis-sim/homewizard:ro
      - ../simulators/zigbee:/huis-sim/zigbee:ro
  huis-browser:
    profiles: [huis-browser]
    image: jlp-integraal/huis-browser:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ../..
      dockerfile: e2e/integral/Dockerfile.huisbrowser
    command: [sleep, infinity]
  home-control-hub:
    profiles: [huis]
    image: jlp-integraal/home-control-hub:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/home-control-hub
      dockerfile: deploy/allinone/Dockerfile
    ports: ["127.0.0.1:${INTEGRAAL_HOME_CONTROL_HUB_POORT:-30420}:30420"]
    volumes: [integraties:/appdata]
  appstore:
    profiles: [appstore]
    image: jlp-integraal/appstore:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/appstore-en-fork
      dockerfile: deploy/allinone/Dockerfile
    ports: ["127.0.0.1:${INTEGRAAL_APPSTORE_POORT:-30430}:30430"]
    volumes: [appstore:/appdata]
    environment:
      HUB_URL: http://hub:30400
      HUB_ENROLLMENT_TOKEN: ${INTEGRAAL_APPSTORE_ENROLLMENT:-}
      HUB_KEY_FINGERPRINT: ${INTEGRAAL_APPSTORE_AFDRUK:-}
  schema-release:
    profiles: [schema]
    image: ghcr.io/lvos04/jelly-leon-platform:0.1.0@sha256:210a3d1a2059e0ff92979f5612e0f0b82ef512afdceeb84b6871e98d1db045ca
    volumes: [schemaproef:/appdata]
  schema-nieuw:
    profiles: [schema]
    image: jlp-integraal/schema-nieuw:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ../..
      dockerfile: e2e/integral/Dockerfile.schema
      additional_contexts:
        lifecycle_basis: docker-image://jlp-integraal/lifecycle:${INTEGRAAL_TAG:-lokaal}
    volumes: [schemaproef:/appdata]
  upstream-git:
    profiles: [upstream-git]
    image: jlp-integraal/upstream-git:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ../..
      dockerfile: e2e/integral/Dockerfile.upstream
    read_only: true
    environment:
      GIT_ALLOW_PROTOCOL: file
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
      PYTHONDONTWRITEBYTECODE: "1"
      TMPDIR: /proef
    volumes:
      - upstream-proef:/proef
      - ${INTEGRAAL_BRONMAP:-../../..}/jelly-leon/tools/jelly-leon:/synchulp:ro
  zoeken:
    profiles: [zoeken]
    image: jlp-integraal/zoeken:${INTEGRAAL_TAG:-lokaal}
    build:
      <<: *bouw
      context: ${INTEGRAAL_BRONMAP:-../../..}/zoeken-en-persoonlijke-ai
      dockerfile: deploy/allinone/Dockerfile
    ports: ["127.0.0.1:${INTEGRAAL_ZOEKEN_POORT:-30450}:30450"]
    volumes: [zoeken:/appdata]
  jelly-leon:
    profiles: [mediaserver]
    image: jelly-leon:p6
    ports: ["127.0.0.1:${INTEGRAAL_JELLY_LEON_POORT:-30460}:8096"]
    volumes: [mediaserver:/config]

  beszel-sim:
    <<: *derden
    command: [beszel-sim, --host, beszel-sim]
  kuma-sim:
    <<: *derden
    command: [uptime-kuma-sim, --host, kuma-sim]
  gotify-sim:
    <<: *derden
    command: [gotify-sim, --host, gotify-sim]
  authentik-sim:
    <<: *derden
    command: [authentik-sim, --host, authentik-sim]
  onedrive:
    <<: *derden
    profiles: [onedrive]
    command: [onedrive-sim, --host, intern]
  truenas-twee:
    <<: *truenas
    profiles: [herstel]
    hostname: truenas-twee

  node-red:
    profiles: [meldingen]
    image: nodered/node-red:5.0.9-24@sha256:2ccd38b4066648bd5e17430c50a2f8102c566a82fd4f2fc5c342e61664d6896f
    environment:
      FLOWS: >-
        /proef/flows.json -D uiHost=localhost -D disableEditor=true
        -D nodesIncludes=["20-inject.js","15-change.js","21-httprequest.js"]
        -D telemetry={"enabled":false,"updateNotification":false}
        -D proxyOptions={"env":{}}
    volumes:
      - flows:/data
      - ../fixtures/meldingen/flows.json:/proef/flows.json:ro
  uptime-kuma:
    profiles: [meldingen]
    image: ghcr.io/louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes: [kuma:/app/data]
  gotify:
    profiles: [meldingen]
    image: ghcr.io/gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
    volumes: [gotify:/app/data]

networks:
  default:
    internal: true

volumes:
  hub: {}
  executor: {}
  lifecycle: {}
  mediaguard: {}
  inhoud-config: {}
  inhoud-werk: {}
  inhoud-media: {}
  mso: {}
  huis: {}
  integraties: {}
  appstore: {}
  schemaproef: {}
  upstream-proef: {}
  zoeken: {}
  mediaserver: {}
  flows: {}
  kuma: {}
  gotify: {}
