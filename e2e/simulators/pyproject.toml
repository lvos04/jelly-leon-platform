# Simulators van apps van derden (Beszel, Uptime Kuma, Gotify, Authentik) + gedeelde testbediening (simkit).
# ALLEEN voor tests en de integrale E2E-omgeving; geen productiecode. De TrueNAS-simulator (truenas/) en de
# Hub-simulator (hub/) hebben hun eigen opzet. Installeren: pip install -e 'e2e/simulators[test]'.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlp-derden-sims"
version = "0.1.0"
description = "Simulators van Beszel, Uptime Kuma, Gotify en Authentik voor tests van het TrueNAS Home Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
beszel-sim = "beszel_sim.__main__:main"
uptime-kuma-sim = "uptime_kuma_sim.__main__:main"
gotify-sim = "gotify_sim.__main__:main"
authentik-sim = "authentik_sim.__main__:main"

[tool.setuptools]
packages = ["simkit", "beszel_sim", "uptime_kuma_sim", "gotify_sim", "authentik_sim"]

[tool.setuptools.package-dir]
simkit = "simkit"
beszel_sim = "beszel"
uptime_kuma_sim = "uptime_kuma"
gotify_sim = "gotify"
authentik_sim = "authentik"

[tool.pytest.ini_options]
testpaths = ["beszel/tests", "uptime_kuma/tests", "gotify/tests", "authentik/tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
