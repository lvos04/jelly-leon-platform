# Simulators van apps van derden met gedeelde testbediening (simkit).
# ALLEEN voor tests en de integrale E2E-omgeving; geen productiecode. De TrueNAS-simulator (truenas/) en de
# Hub-simulator (hub/) hebben hun eigen opzet. Installeren: pip install -e 'e2e/simulators[test]'.
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jlp-derden-sims"
version = "0.1.0"
description = "Simulators van Beszel, Uptime Kuma, Gotify, Authentik, de downloadketen en huis en energie (Gree, HomeWizard, Zigbee), het offsite-doel (OneDrive) en de Jellyfin-upstream (git) voor tests van het TrueNAS Home Platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "defusedxml==0.7.1", "python-multipart==0.0.33"]

[project.scripts]
credits-sim = "credits.__main__:main"
beszel-sim = "beszel_sim.__main__:main"
uptime-kuma-sim = "uptime_kuma_sim.__main__:main"
gotify-sim = "gotify_sim.__main__:main"
authentik-sim = "authentik_sim.__main__:main"
arr-sim = "arr_sim.__main__:main"
sabnzbd-sim = "sabnzbd_sim.__main__:main"
qbittorrent-sim = "qbittorrent_sim.__main__:main"
gree-sim = "gree_sim.__main__:main"
homewizard-sim = "homewizard_sim.__main__:main"
zigbee-sim = "zigbee_sim.__main__:main"
onedrive-sim = "onedrive_sim.__main__:main"

[tool.setuptools]
packages = ["simkit", "credits", "beszel_sim", "uptime_kuma_sim", "gotify_sim", "authentik_sim",
            "arr_sim", "sabnzbd_sim", "qbittorrent_sim", "gree_sim", "homewizard_sim", "zigbee_sim",
            "onedrive_sim"]

[tool.setuptools.package-dir]
simkit = "simkit"
beszel_sim = "beszel"
uptime_kuma_sim = "uptime_kuma"
gotify_sim = "gotify"
authentik_sim = "authentik"
arr_sim = "arr"
sabnzbd_sim = "sabnzbd"
qbittorrent_sim = "qbittorrent"
gree_sim = "gree"
homewizard_sim = "homewizard"
zigbee_sim = "zigbee"
onedrive_sim = "onedrive"

[tool.pytest.ini_options]
testpaths = ["credits/tests", "beszel/tests", "uptime_kuma/tests", "gotify/tests", "authentik/tests",
             "arr/tests", "sabnzbd/tests", "qbittorrent/tests", "gree/tests", "homewizard/tests", "zigbee/tests",
             "onedrive/tests", "upstream-git/tests"]
# De scenarioproeven importeren e2e.integral vanuit de repo. upstream-git bevat een losse testmodule.
pythonpath = ["../..", "upstream-git"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
